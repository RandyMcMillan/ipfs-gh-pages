name: 'Setup test environment'
description: 'Node with npm cache, install dependencies, and a cached Chrome for Testing for the CDP suite.'
inputs:
  node-version:
    description: 'Node.js version to use.'
    required: false
    default: '26'
runs:
  using: 'composite'
  steps:
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ inputs.node-version }}
        cache: 'npm'

    - name: Cache Chrome for Testing
      uses: actions/cache@v4
      with:
        path: ~/.cache/puppeteer
        key: ${{ runner.os }}-puppeteer-chrome-${{ hashFiles('package-lock.json') }}
        restore-keys: |
          ${{ runner.os }}-puppeteer-chrome-

    - name: Install dependencies
      shell: bash
      run: npm ci

    - name: Install Chrome system libraries
      if: runner.os == 'Linux'
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends \
          libnss3 libnspr4 libdrm2 libxkbcommon0 libxcomposite1 libxdamage1 \
          libxfixes3 libxrandr2 libgbm1 libpango-1.0-0 libcairo2
        sudo apt-get install -y --no-install-recommends \
          libatk1.0-0t64 libatk-bridge2.0-0t64 libcups2t64 libasound2t64 \
          libatspi2.0-0t64 || \
        sudo apt-get install -y --no-install-recommends \
          libatk1.0-0 libatk-bridge2.0-0 libcups2 libasound2 libatspi2.0-0

    - name: Ensure Chrome
      shell: bash
      run: npm run ci:chrome
