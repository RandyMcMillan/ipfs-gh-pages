name: Deploy Helia App to GitHub Pages

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup test environment
        uses: ./.github/actions/test-setup

      - name: Run Tests
        run: npm run test:ci

  deploy:
    needs: test
    if: github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Project
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload Artifacts
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  smoke-test:
    needs: deploy
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup test environment
        uses: ./.github/actions/test-setup

      - name: Wait for Pages deployment
        run: |
          url="${{ needs.deploy.outputs.page_url }}"
          echo "Waiting for $url"
          for i in $(seq 1 60); do
            if curl -s -o /dev/null -w "%{http_code}" "$url" | grep -q "200"; then
              echo "Pages site is live"
              break
            fi
            sleep 2
          done

      - name: Run tests against deployed site
        env:
          TEST_URL: ${{ needs.deploy.outputs.page_url }}
        run: npm run test:ci