name: Action packaging smoke test

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        # Submodules intentionally NOT checked out here: the gitlink guard
        # below runs first, so a bad push order fails with a clear message
        # instead of checkout's cryptic "upload-pack: not our ref".

      - name: Verify submodule gitlinks resolve on their remotes
        run: node scripts/check-gitlink.mjs

      - name: Checkout submodules
        run: git submodule update --init --recursive

      - name: Build via packaged action
        uses: ./
        with:
          deploy: 'false'
          out-dir: ${{ github.workspace }}/action-dist

      - name: Verify bundle
        run: |
          test -f "${{ github.workspace }}/action-dist/index.html"
          echo "Bundle OK"
          test -f "${{ github.workspace }}/actions-test/actions-test.car"
          echo "Submodule CAR OK"

  rust-smoke:
    # Pinned: ubuntu-latest is migrating (to 26.04) and the migration broke
    # the glib preinstalls this job used to rely on. Deps are now installed
    # explicitly below — the pin stops the next migration from breaking it.
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
          targets: wasm32-unknown-unknown

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: rustfmt
        run: cargo fmt --check

      - name: Check wasm browser build
        run: cargo check --target wasm32-unknown-unknown

      # wry 0.55 / webkit2gtk-sys 2.0: pkg-config needs glib-2.0, gtk-3,
      # webkit2gtk-4.1 and libsoup-3.0 dev files on Linux.
      # The .deb set + package lists are cached; the key hashes this
      # workflow file, so touching the package list below busts it.
      - name: Cache apt archives
        id: apt-cache
        uses: actions/cache@v4
        with:
          path: |
            /var/cache/apt/archives
            /var/lib/apt/lists
          key: apt-ubuntu-24.04-v1-${{ hashFiles('.github/workflows/action-smoke.yml') }}

      - name: Install desktop build deps
        run: |
          if [ "${{ steps.apt-cache.outputs.cache-hit }}" != "true" ]; then
            sudo apt-get update
          fi
          sudo apt-get install -y libglib2.0-dev libgtk-3-dev libwebkit2gtk-4.1-dev libsoup-3.0-dev

      - name: Check desktop build (bundle-wry)
        run: cargo check --features bundle-wry