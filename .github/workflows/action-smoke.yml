name: Action packaging smoke test

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        # Submodules intentionally NOT checked out here: the gitlink guard
        # below runs first, so a bad push order fails with a clear message
        # instead of checkout's cryptic "upload-pack: not our ref".

      - name: Verify submodule gitlinks resolve on their remotes
        run: node scripts/check-gitlink.mjs

      - name: Checkout submodules
        run: git submodule update --init --recursive

      - name: Build via packaged action
        uses: ./
        with:
          deploy: 'false'
          out-dir: ${{ github.workspace }}/action-dist

      - name: Verify bundle
        run: |
          test -f "${{ github.workspace }}/action-dist/index.html"
          echo "Bundle OK"
          test -f "${{ github.workspace }}/actions-test/actions-test.car"
          echo "Submodule CAR OK"

  rust-smoke:
    # Pinned: ubuntu-latest is migrating (to 26.04) and the migration broke
    # the glib preinstalls this job used to rely on. Deps are now installed
    # explicitly below — the pin stops the next migration from breaking it.
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
          targets: wasm32-unknown-unknown

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: rustfmt
        run: cargo fmt --check

      - name: Check wasm browser build
        run: cargo check --target wasm32-unknown-unknown

      - name: Unit tests (TUI tree/navigation/markdown logic)
        run: cargo test --lib

      # wry 0.55 / webkit2gtk-sys 2.0: pkg-config needs glib-2.0, gtk-3,
      # webkit2gtk-4.1 and libsoup-3.0 dev files on Linux.
      # The .deb set + package lists are cached; the key hashes this
      # workflow file, so touching the package list below busts it.
      - name: Cache apt archives
        id: apt-cache
        uses: actions/cache@v4
        with:
          path: |
            /var/cache/apt/archives
            /var/lib/apt/lists
          key: apt-ubuntu-24.04-v1-${{ hashFiles('.github/workflows/action-smoke.yml') }}

      - name: Install desktop build deps
        run: |
          if [ "${{ steps.apt-cache.outputs.cache-hit }}" != "true" ]; then
            sudo apt-get update
          fi
          sudo apt-get install -y libglib2.0-dev libgtk-3-dev libwebkit2gtk-4.1-dev libsoup-3.0-dev

      - name: Check desktop build (bundle-wry)
        run: cargo check --features bundle-wry

  ai-smoke:
    # Optional AI-assisted diff review via the NVIDIA build API (default
    # model moonshotai/kimi-k3.1-pro, override with NVIDIA_MODEL). Needs the
    # NVIDIA_API_KEY repository secret; without it the step warns and this
    # job passes — it never blocks the smoke suite. Fork PRs get no secrets,
    # so they warn-and-pass too.
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2 # HEAD~1..HEAD diff for push events

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # No npm ci: engines requires Node >= 26 and the script uses only
      # built-in fetch.
      - name: AI diff review (NVIDIA)
        env:
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          GH_EVENT: ${{ github.event_name }}
          GH_BASE_REF: ${{ github.base_ref }}
        run: node scripts/nvidia-ai.mjs

      # Same-repo PRs only: fork PRs have a read-only token, and their
      # ai-review.md never exists anyway (no secrets -> warn-and-pass).
      - name: Comment AI review on PR
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && hashFiles('ai-review.md') != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh pr comment ${{ github.event.pull_request.number }} --body-file ai-review.md