name: Action packaging smoke test

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build via packaged action
        uses: ./
        with:
          deploy: 'false'
          out-dir: ${{ github.workspace }}/action-dist

      - name: Verify bundle
        run: |
          test -f "${{ github.workspace }}/action-dist/index.html"
          echo "Bundle OK"
          test -f "${{ github.workspace }}/actions-test/actions-test.car"
          echo "Submodule CAR OK"

  rust-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
          targets: wasm32-unknown-unknown

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: rustfmt
        run: cargo fmt --check

      - name: Check wasm browser build
        run: cargo check --target wasm32-unknown-unknown

      - name: Check desktop build (bundle-wry)
        run: cargo check --features bundle-wry