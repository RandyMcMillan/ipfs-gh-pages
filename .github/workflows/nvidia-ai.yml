name: NVIDIA AI Review

# AI-assisted review of each push/PR via the NVIDIA build API
# (model overridable via NVIDIA_MODEL, default moonshotai/kimi-k3.1-pro).
# Requires the NVIDIA_API_KEY repository secret; without it the step
# warns and the build still passes.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  ai-review:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2 # HEAD~1..HEAD diff for push events

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # No npm ci: engines requires Node >= 26 and the script uses only
      # built-in fetch.
      - name: Run AI review
        env:
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          GH_EVENT: ${{ github.event_name }}
          GH_BASE_REF: ${{ github.base_ref }}
        run: node scripts/nvidia-ai.mjs

      - name: Comment AI review on PR
        if: github.event_name == 'pull_request' && hashFiles('ai-review.md') != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh pr comment ${{ github.event.pull_request.number }} --body-file ai-review.md
