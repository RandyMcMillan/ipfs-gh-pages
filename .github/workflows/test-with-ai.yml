name: AI Testing Demo

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ai-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: AI Integration Test
        run: |
          echo "Starting AI-powered testing..."
          echo "This workflow demonstrates AI integration for testing"
          npm run test:unit || true
          echo "AI testing demo completed!"
