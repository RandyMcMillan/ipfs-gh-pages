name: Release

on:
  push:
    tags:
      - 'v*'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Chrome
        run: |
          npx --yes @puppeteer/browsers install chrome@stable >/dev/null
          CHROME_BIN=$(find "$HOME/.cache/puppeteer/chrome" -path '*chrome-linux64/chrome' -type f | head -1)
          echo "Installed: $CHROME_BIN"
          echo "CHROME_PATH=$CHROME_BIN" >> "$GITHUB_ENV"

      - name: Install Dependencies
        run: npm ci

      - name: Start Dev Server
        run: |
          npm run dev -- --host 127.0.0.1 --port 5173 &
          for i in $(seq 1 60); do
            if curl -s http://127.0.0.1:5173 >/dev/null; then
              echo "Dev server ready"
              break
            fi
            sleep 1
          done

      - name: Run Tests
        env:
          CHROME_PATH: ${{ env.CHROME_PATH }}
        run: |
          npm test

  release:
    needs: test
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Project
        run: npm run build

      - name: Archive ./dist
        run: |
          cd dist
          zip -r ../dist.zip .
          cd ..
          ls -lh dist.zip

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist.zip
          generate_release_notes: true