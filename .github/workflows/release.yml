name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Chromium
        run: |
          sudo apt-get update
          sudo apt-get install -y chromium-browser

      - name: Install Dependencies
        run: npm ci

      - name: Start Dev Server
        run: |
          npm run dev -- --host 127.0.0.1 --port 5173 &
          for i in $(seq 1 60); do
            if curl -s http://127.0.0.1:5173 >/dev/null; then
              echo "Dev server ready"
              break
            fi
            sleep 1
          done

      - name: Run Tests
        env:
          CHROME_PATH: /usr/bin/chromium-browser
        run: |
          npm run test
          npm run test:eval
          npm run test:zip
          npm run test:download

  release:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Project
        run: npm run build

      - name: Archive ./dist
        run: |
          cd dist
          zip -r ../dist.zip .
          cd ..
          ls -lh dist.zip

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist.zip
          generate_release_notes: true