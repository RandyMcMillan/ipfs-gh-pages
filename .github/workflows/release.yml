name: Release

on:
  push:
    tags:
      - 'v*'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup test environment
        uses: ./.github/actions/test-setup
        with:
          tui: 'true' # test:ci builds the TUI with trunk for the cdp-rust-* suites

      - name: Run Tests
        run: npm run test:ci

  release:
    needs: test
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Project
        run: npm run build

      - name: Build TUI archive (terminal-view add-value)
        run: |
          rustup target add wasm32-unknown-unknown
          cargo install trunk --locked 2>/dev/null || cargo install trunk
          node scripts/build-ipfs-js.mjs
          node scripts/build-repo-files.mjs
          trunk build --release --dist target/tui-release-dist
          cd target/tui-release-dist
          zip -r ../../rust-dist.zip .
          cd ../..
          ls -lh rust-dist.zip

      - name: Archive ./dist
        run: |
          cd dist
          zip -r ../dist.zip .
          cd ..
          ls -lh dist.zip

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist.zip
            rust-dist.zip
          generate_release_notes: true