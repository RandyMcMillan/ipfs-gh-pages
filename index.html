<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Self-Hosted IPFS Node on GitHub Pages</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      max-width: 800px;
      margin: 2rem auto;
      padding: 0 1rem;
      background: #121212;
      color: #e0e0e0;
    }
    .card {
      border: 1px solid #333;
      border-radius: 8px;
      padding: 1.5rem;
      margin-bottom: 1.5rem;
      background: #1e1e1e;
    }
    textarea, input {
      width: 100%;
      padding: 0.5rem;
      margin: 0.5rem 0 1rem 0;
      background: #2a2a2a;
      border: 1px solid #444;
      color: #fff;
      border-radius: 4px;
      box-sizing: border-box;
    }
    button {
      background: #0088ff;
      color: white;
      border: none;
      padding: 0.6rem 1.2rem;
      border-radius: 4px;
      cursor: pointer;
      font-weight: bold;
    }
    button:disabled {
      background: #555;
      cursor: not-allowed;
    }
    .status {
      font-weight: bold;
      color: #00ff88;
    }
    pre {
      background: #000;
      padding: 1rem;
      border-radius: 4px;
      overflow-x: auto;
      color: #00ff88;
    }
  </style>
</head>
<body>
  <h1>Helia IPFS - Browser Self-Hosting</h1>
  
  <div class="card">
    <h3>Node Status</h3>
    <p>Status: <span id="node-status" class="status">Initializing Helia IPFS Node...</span></p>
    <p>Peer ID: <code id="peer-id">...</code></p>
  </div>

  <div class="card">
    <h3>Publish Content to IPFS</h3>
    <label for="input-content">Text / Data to Publish:</label>
    <textarea id="input-content" rows="4" placeholder="Type something to publish to the decentralized network..."></textarea>
    <button id="btn-publish" disabled>Publish Data</button>
    
    <h4>Result CID:</h4>
    <pre id="output-cid">None</pre>
  </div>

  <div class="card">
    <h3>Repository File Tree</h3>
    <div id="file-tree">Loading repository tree...</div>
  </div>

  <div class="card">
    <h3>Fetch Content from IPFS Network</h3>
    <label for="input-cid">Enter IPFS Content ID (CID):</label>
    <input type="text" id="input-cid" placeholder="bafkreic..." />
    <button id="btn-fetch" disabled>Fetch via Helia Node</button>
    
    <h4>Retrieved Data:</h4>
    <pre id="output-content">None</pre>
  </div>

  <script type="module" src="/main.js"></script>
</body>
</html>
