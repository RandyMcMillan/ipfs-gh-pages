name: 'Helia IPFS GitHub Pages'
description: 'Build (and optionally deploy) a browser-based IPFS node that embeds every file in your repository, served from GitHub Pages.'
author: 'RandyMcMillan'

branding:
  icon: 'box'
  color: 'blue'

inputs:
  node-version:
    description: 'Node.js version to use for the build.'
    required: false
    default: '26'
  repo-root:
    description: 'Directory whose tracked files are embedded into the IPFS bundle. Defaults to the checked-out repository root.'
    required: false
    default: ${{ github.workspace }}
  out-dir:
    description: 'Directory where the production bundle is written.'
    required: false
    default: ${{ github.workspace }}/dist
  deploy:
    description: 'Deploy the built bundle to GitHub Pages.'
    required: false
    default: 'true'
  run-tests:
    description: 'Run the integration test suite (requires Chromium) before building.'
    required: false
    default: 'false'
  pinata-jwt:
    description: 'Optional Pinata JWT (pass it as a repo secret, e.g. the PINATA_JWT secret). Pins the built CAR to Pinata public IPFS; empty = skipped.'
    required: false
    default: ''

outputs:
  dist-path:
    description: 'Absolute path to the built bundle directory.'
    value: ${{ steps.build.outputs.dist_path }}
  page-url:
    description: 'URL of the deployed GitHub Pages site (present when deploy is true).'
    value: ${{ steps.deployment.outputs.page_url }}

runs:
  using: 'composite'
  steps:
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ inputs.node-version }}

    - name: Install dependencies
      shell: bash
      working-directory: ${{ github.action_path }}
      run: npm ci

    - name: Run tests (optional)
      if: ${{ inputs.run-tests == 'true' }}
      shell: bash
      working-directory: ${{ github.action_path }}
      env:
        REPO_ROOT: ${{ inputs.repo-root }}
      run: npm run test:ci

    - name: Build bundle
      id: build
      shell: bash
      working-directory: ${{ github.action_path }}
      env:
        REPO_ROOT: ${{ inputs.repo-root }}
        OUT_DIR: ${{ inputs.out-dir }}
      run: |
        mkdir -p "${{ inputs.out-dir }}"
        # Consumer path: build:action deliberately skips
        # scripts/install-consumer-example.mjs — the fixture workflow
        # lockstep is an action-repo-internal concern, and the REPO_ROOT
        # env here points at the CONSUMER's checkout where the action
        # repo's .github/workflows/deploy-gh-pages.yml doesn't exist
        # (crashed consumer deploys).
        npm run build:action
        echo "dist_path=${{ inputs.out-dir }}" >> "$GITHUB_OUTPUT"

    # Optional service (docs/optional-services.md): never fatal, JWT never printed.
    - name: Pin CAR to Pinata (optional)
      if: ${{ inputs.pinata-jwt != '' }}
      shell: bash
      working-directory: ${{ github.action_path }}
      env:
        PINATA_JWT: ${{ inputs.pinata-jwt }}
      run: |
        node scripts/pinata-pin.mjs "${{ inputs.out-dir }}/ipfs-gh-pages.car" "${{ github.repository }}@${{ github.sha }}" --car \
          || echo "::warning::Pinata pin failed (optional service — build output is unaffected)"

    - name: Configure Pages
      if: ${{ inputs.deploy == 'true' }}
      uses: actions/configure-pages@v4

    - name: Upload Pages artifact
      if: ${{ inputs.deploy == 'true' }}
      uses: actions/upload-pages-artifact@v3
      with:
        path: ${{ inputs.out-dir }}

    - name: Deploy to GitHub Pages
      if: ${{ inputs.deploy == 'true' }}
      id: deployment
      uses: actions/deploy-pages@v4