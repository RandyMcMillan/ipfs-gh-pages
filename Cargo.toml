[package]
name = "ipfs-gh-pages"
version = "0.1.0"
edition = "2021"
description = "Ratzilla web and wry desktop app example"
publish = false

[package.metadata.bundle]
name = "ipfs-gh-pages"
identifier = "org.gnostr.ipfs-gh-pages"
icon = ["icons/icon.icns"]
category = "Utility"
short_description = "ratatui-ratzilla bundle wry example"

[package.metadata.bundle.bin.ipfs-gh-pages]
name = "ipfs-gh-pages"
identifier = "org.gnostr.ipfs-gh-pages"
icon = ["icons/icon.icns"]
category = "Utility"
short_description = "ipfs-gh-pages"
resources = ["dist"]

[features]
# Empty by default: trunk/wasm builds must not pull wry/tao/muda (native-only)
# into the wasm32 graph. The desktop bundle passes --features bundle-wry
# explicitly (see scripts/bundle.sh).
default = []
bundle-wry = ["dep:tao", "dep:wry", "dep:muda"]

[dependencies]
critical-section = { version = "1.2", features = ["std"] }
js-sys = "0.3"
muda = { version = "0.19", optional = true }
rand = { version = "0.9.2", default-features = false, features = ["small_rng"] }
ratzilla = "0.3.1"
tachyonfx = { version = "0.23.0", default-features = false, features = ["wasm"] }
tao = { version = "0.35.3", optional = true }
wasm-bindgen = "0.2.108"
web-time = "1.1.0"
wry = { version = "0.55.1", optional = true }

# CLI parsing for the native binaries (desktop app + stub). Deliberately
# NOT a wasm dependency — the browser build gets no arg parsing and the
# trunk bundle stays lean.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
clap = { version = "4.5", features = ["derive"] }
