# Self-hosting stack for ipfs-gh-pages (docs/docker.md) — additive to the
# GitHub Action; nothing here is on the consumer path.
#
#   docker compose up --build                 # web only (profile: minimal)
#   docker compose --profile full up --build  # + Kubo sidecar + rehost + CAR seed
#
# Kubo and the rehost service are accelerants, never dependencies
# (docs/optional-services.md): `web` alone is a complete deployment.

name: ipfs-gh-pages

networks:
  ipfs-gh-pages-net:
    name: ipfs-gh-pages-net

services:
  web:
    build:
      context: ..
      dockerfile: docker/Dockerfile.site
    image: ghcr.io/randymcmillan/ipfs-gh-pages:${TAG:-local}
    container_name: ipfs-gh-pages-web
    ports:
      - "${WEB_PORT:-8080}:80"
    ipc: private
    restart: always
    networks:
      - ipfs-gh-pages-net
    deploy:
      resources:
        limits:
          memory: 256M

  kubo:
    profiles: ["full"]
    image: ipfs/kubo:master
    container_name: ipfs-gh-pages-kubo
    # Loopback inside the container network; expose only if you know why.
    ports:
      - "${KUBO_API_PORT:-5001}:5001"
      - "${KUBO_GATEWAY_PORT:-8081}:8080"
    environment:
      IPFS_PROFILE: server
    volumes:
      - kubo-data:/data/ipfs
    ipc: private
    restart: always
    networks:
      - ipfs-gh-pages-net
    deploy:
      resources:
        limits:
          memory: 1G

  kubo-init:
    profiles: ["full"]
    image: curlimages/curl:8.10.1
    container_name: ipfs-gh-pages-kubo-init
    command: ["sh", "/init/kubo-init.sh"]
    environment:
      KUBO_RPC: http://kubo:5001
      WEB_URL: http://web
    volumes:
      - ./kubo-init.sh:/init/kubo-init.sh:ro
    ipc: private
    restart: "no"
    depends_on:
      - web
      - kubo
    networks:
      - ipfs-gh-pages-net

  rehost:
    profiles: ["full"]
    image: node:26-alpine
    container_name: ipfs-gh-pages-rehost
    working_dir: /srv
    command: ["node", "scripts/rehost-service.mjs"]
    environment:
      PORT: "8787"
      CAMO_KEY: ${CAMO_KEY:-}
    volumes:
      - ../scripts:/srv/scripts:ro
      - ../package.json:/srv/package.json:ro
    ipc: private
    restart: always
    networks:
      - ipfs-gh-pages-net
    deploy:
      resources:
        limits:
          memory: 512M

volumes:
  kubo-data:
