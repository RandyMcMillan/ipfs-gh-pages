<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ratzilla Demo</title>
    <link data-trunk rel="rust" data-bin="ipfs-gh-pages" data-cargo-no-default-features />
    <link data-trunk rel="copy-file" href="assets/ipfs-node.js" data-target-path="assets" />
    <script type="module" src="./assets/ipfs-node.js"></script>
    <style>
      html {
        height: 100%;
      }
      body {
        position: relative;
        height: calc(100% - 40px);
        margin: 20px;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        align-content: center;
        background-color: #121212;
      }
      canvas {
        display: block;
        width: calc(100vw - 40px);
        height: 100%;
      }
      pre {
        font-family: "Fira Code", monospace;
        font-size: 16px;
        margin: 0px;
      }
      .topbar {
        width: 100%;
        display: flex;
        justify-content: space-between;
        align-items: center;
      }
      /* Stacking contract with ratzilla (see src/utils.rs
         inject_backend_footer): the Rust wasm appends its own fixed footer —
         backend switcher + FPS, z-index 1000, ~33px tall — to <body> at
         runtime, at bottom: 0. This bar must sit directly ABOVE it, never
         at bottom: 0, or the two overlap and this bar is hidden. */
      #ipfs-status {
        position: fixed;
        bottom: 33px;
        left: 0;
        right: 0;
        padding: 4px 12px;
        font-family: "Fira Code", monospace;
        font-size: 12px;
        color: #9e9e9e;
        background: #1a1a1a;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        z-index: 1000;
      }
    </style>
  </head>
  <body>
    <div id="ipfs-status">IPFS node not started</div>
    <!-- #ipfs-status is written by js/ipfs-node.js (the Helia node). The
         ratzilla wasm appends its own fixed footer (backend switcher + FPS,
         z-index 1000) at bottom: 0 at runtime; this div sits above it via
         bottom: 33px. See the .rs module docs in src/main.rs and
         inject_backend_footer in src/utils.rs for the full contract. -->
  </body>
</html>
