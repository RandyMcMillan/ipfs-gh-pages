<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ratzilla Demo</title>
    <link data-trunk rel="rust" data-bin="ipfs-gh-pages" data-cargo-no-default-features />
    <link data-trunk rel="copy-file" href="assets/ipfs-node.js" data-target-path="assets" />
    <link data-trunk rel="copy-file" href="assets/repo-files.json" data-target-path="assets" />
    <link data-trunk rel="copy-file" href="assets/repo-head.txt" data-target-path="assets" />
    <script type="module" src="./assets/ipfs-node.js"></script>
    <style>
      html {
        height: 100%;
      }
      body {
        position: relative;
        height: calc(100% - 40px);
        margin: 20px;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        align-content: center;
        background-color: #121212;
      }
      canvas {
        display: block;
        width: calc(100vw - 40px);
        height: 100%;
      }
      pre {
        font-family: "Fira Code", monospace;
        font-size: 16px;
        margin: 0px;
      }
      .topbar {
        width: 100%;
        display: flex;
        justify-content: space-between;
        align-items: center;
      }
    </style>
  </head>
  <body>
    <!-- IPFS status lives in the ratzilla footer, not here: wasm injects
         #ratzilla-ipfs-status (left side) via inject_backend_footer in
         src/utils.rs, and js/ipfs-node.js writes into it. Backend links +
         FPS on the right. -->
  </body>
</html>
